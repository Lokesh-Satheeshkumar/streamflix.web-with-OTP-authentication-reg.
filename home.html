  <header class="banner" aria-label="Featured Movie">

      <h1>Featured Movie</h1>

<div id="videoModal" class="video-modal">

      Your browser does not support the video tag.
    </video>
  </div>
</div>


  <section class="row">
    <h2>Trending Now</h2>
    <div class="thumbnails">
      <img src="dude.jpg" alt="Movie 1" />
      <img src="truelover.jpg" alt="Movie 2" />
      <img src="mahan.jpg" alt="Movie 3" />
      <img src="retro.jpg" alt="Movie 4" />
